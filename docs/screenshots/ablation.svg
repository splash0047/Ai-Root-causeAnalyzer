<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="abl-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="220" height="700" fill="#0c1220" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(20, 25)">
      <rect width="32" height="32" rx="8" fill="#3b82f6" />
      <text x="10" y="21" fill="#fff" font-size="16">🔍</text>
      <text x="42" y="16" fill="#f8fafc" font-size="14" font-weight="700">AI-RCA</text>
      <text x="42" y="28" fill="#64748b" font-size="10">Observability Platform</text>
    </g>
    <g transform="translate(15, 80)">
      <text x="35" y="24" fill="#94a3b8" font-size="13">📊 Dashboard</text>
      <g transform="translate(0, 48)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">🔬 RCA Detail View</text>
      </g>
      <g transform="translate(0, 96)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">⚡ Failure Simulator</text>
      </g>
      <g transform="translate(0, 144)">
        <rect width="190" height="38" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="35" y="24" fill="#34d399" font-size="13" font-weight="600">🧪 Ablation Study</text>
      </g>
      <g transform="translate(0, 192)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">📈 Model Evaluation</text>
      </g>
    </g>
  </g>

  <!-- Top Bar -->
  <g transform="translate(240, 25)">
    <text x="0" y="20" fill="#f8fafc" font-size="20" font-weight="700">Automated Ablation Study Benchmark Harness</text>
    <text x="0" y="40" fill="#64748b" font-size="12">12 Synthetic &amp; Real Failure Scenarios × 4 Diagnostic Configurations (48 Controlled Runs)</text>
  </g>

  <!-- Ablation Content Grid -->
  <g transform="translate(240, 80)">
    <!-- Progression Comparison Bars (Top) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="920" height="190" rx="8" fill="url(#abl-card-grad)" stroke="#334155" />
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 912 0 C 916.42 0 920 3.58 920 8 L 920 40 L 0 40 Z" fill="#1e293b" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">📊 Diagnostic Accuracy Progression by Engine Configuration</text>

      <g transform="translate(20, 55)">
        <!-- Config 1: Baseline SHAP -->
        <text x="0" y="16" fill="#cbd5e1" font-size="11">1. Baseline (SHAP Only)</text>
        <rect x="240" y="6" width="300" height="14" rx="3" fill="#ef4444" />
        <text x="555" y="18" fill="#f87171" font-size="11" font-weight="700">54.2%  (High False Positive Rate on Noise)</text>

        <!-- Config 2: SHAP + Drift -->
        <text x="0" y="44" fill="#cbd5e1" font-size="11">2. Intermediate (SHAP + Drift)</text>
        <rect x="240" y="34" width="410" height="14" rx="3" fill="#f59e0b" />
        <text x="665" y="46" fill="#fbbf24" font-size="11" font-weight="700">71.8%  (+17.6%)</text>

        <!-- Config 3: SHAP + Drift + Counterfactuals -->
        <text x="0" y="72" fill="#cbd5e1" font-size="11">3. Advanced (+ Counterfactuals &amp; Interactions)</text>
        <rect x="240" y="62" width="510" height="14" rx="3" fill="#3b82f6" />
        <text x="765" y="74" fill="#60a5fa" font-size="11" font-weight="700">86.5%  (+32.3%)</text>

        <!-- Config 4: Full Multi-Signal + Memory RAG -->
        <text x="0" y="100" fill="#cbd5e1" font-size="11">4. Full Stack (+ Pinecone RAG Memory)</text>
        <rect x="240" y="90" width="560" height="14" rx="3" fill="#10b981" />
        <text x="815" y="102" fill="#34d399" font-size="12" font-weight="700">92.4%  (PROVEN MAX ACCURACY)</text>
      </g>
    </g>

    <!-- Detailed Scenario Matrix Table (Bottom) -->
    <g transform="translate(0, 210)" filter="url(#shadow)">
      <rect width="920" height="370" rx="8" fill="url(#abl-card-grad)" stroke="#334155" />
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 912 0 C 916.42 0 920 3.58 920 8 L 920 40 L 0 40 Z" fill="#1e293b" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">🧪 Scenario Benchmark Matrix (12 Test Cases)</text>

      <!-- Table Header -->
      <g transform="translate(20, 55)">
        <rect width="880" height="30" rx="4" fill="#0f172a" stroke="#334155" />
        <text x="14" y="20" fill="#94a3b8" font-size="11" font-weight="700">SCENARIO NAME</text>
        <text x="260" y="20" fill="#94a3b8" font-size="11" font-weight="700">INJECTION MODE</text>
        <text x="440" y="20" fill="#94a3b8" font-size="11" font-weight="700">SHAP ONLY</text>
        <text x="560" y="20" fill="#94a3b8" font-size="11" font-weight="700">SHAP+DRIFT</text>
        <text x="680" y="20" fill="#94a3b8" font-size="11" font-weight="700">ADVANCED</text>
        <text x="790" y="20" fill="#94a3b8" font-size="11" font-weight="700">FULL RAG</text>

        <!-- Row 1 -->
        <text x="14" y="55" fill="#e2e8f0" font-size="11">1. Credit Score Mean Shift (30%)</text>
        <text x="260" y="55" fill="#94a3b8" font-size="11">Covariate Drift</text>
        <text x="440" y="55" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="560" y="55" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="680" y="55" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="55" fill="#10b981" font-size="11">✓ Hit</text>

        <!-- Row 2 -->
        <text x="14" y="85" fill="#e2e8f0" font-size="11">2. DTI Ratio Gaussian Noise (50%)</text>
        <text x="260" y="85" fill="#94a3b8" font-size="11">Noise Injection</text>
        <text x="440" y="85" fill="#ef4444" font-size="11">✗ Miss (False Pos)</text>
        <text x="560" y="85" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="680" y="85" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="85" fill="#10b981" font-size="11">✓ Hit</text>

        <!-- Row 3 -->
        <text x="14" y="115" fill="#e2e8f0" font-size="11">3. Income 100% Nulls Drop</text>
        <text x="260" y="115" fill="#94a3b8" font-size="11">Integrity Drop</text>
        <text x="440" y="115" fill="#ef4444" font-size="11">✗ Miss</text>
        <text x="560" y="115" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="680" y="115" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="115" fill="#10b981" font-size="11">✓ Hit</text>

        <!-- Row 4 -->
        <text x="14" y="145" fill="#e2e8f0" font-size="11">4. Age × Income Non-Linear Decay</text>
        <text x="260" y="145" fill="#94a3b8" font-size="11">Interaction</text>
        <text x="440" y="145" fill="#ef4444" font-size="11">✗ Miss</text>
        <text x="560" y="145" fill="#ef4444" font-size="11">✗ Miss</text>
        <text x="680" y="145" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="145" fill="#10b981" font-size="11">✓ Hit</text>

        <!-- Row 5 -->
        <text x="14" y="175" fill="#e2e8f0" font-size="11">5. Macroeconomic Default Shift</text>
        <text x="260" y="175" fill="#94a3b8" font-size="11">Concept Drift</text>
        <text x="440" y="175" fill="#ef4444" font-size="11">✗ Miss</text>
        <text x="560" y="175" fill="#ef4444" font-size="11">✗ Miss</text>
        <text x="680" y="175" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="175" fill="#10b981" font-size="11">✓ Hit</text>

        <!-- Row 6 -->
        <text x="14" y="205" fill="#e2e8f0" font-size="11">6. Upstream Truncation Spike</text>
        <text x="260" y="205" fill="#94a3b8" font-size="11">Integrity Out-of-Bound</text>
        <text x="440" y="205" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="560" y="205" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="680" y="205" fill="#10b981" font-size="11">✓ Hit</text>
        <text x="790" y="205" fill="#10b981" font-size="11">✓ Hit</text>
      </g>
    </g>
  </g>
</svg>
