<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="sim-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Left Sidebar -->
  <g transform="translate(0, 0)">
    <rect width="220" height="700" fill="#0c1220" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(20, 25)">
      <rect width="32" height="32" rx="8" fill="#3b82f6" />
      <text x="10" y="21" fill="#fff" font-size="16">🔍</text>
      <text x="42" y="16" fill="#f8fafc" font-size="14" font-weight="700">AI-RCA</text>
      <text x="42" y="28" fill="#64748b" font-size="10">Observability Platform</text>
    </g>
    <g transform="translate(15, 80)">
      <text x="35" y="24" fill="#94a3b8" font-size="13">📊 Dashboard</text>
      <g transform="translate(0, 48)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">🔬 RCA Detail View</text>
      </g>
      <g transform="translate(0, 96)">
        <rect width="190" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
        <text x="35" y="24" fill="#fbbf24" font-size="13" font-weight="600">⚡ Failure Simulator</text>
      </g>
      <g transform="translate(0, 144)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">🧪 Ablation Study</text>
      </g>
      <g transform="translate(0, 192)">
        <text x="35" y="24" fill="#94a3b8" font-size="13">📈 Model Evaluation</text>
      </g>
    </g>
  </g>

  <!-- Top Title Bar -->
  <g transform="translate(240, 25)">
    <text x="0" y="20" fill="#f8fafc" font-size="20" font-weight="700">Controlled Failure Injection &amp; Live RCA Harness</text>
    <text x="0" y="40" fill="#64748b" font-size="12">Simulate real-world data pipeline and distribution corruptions to stress-test diagnosis</text>
  </g>

  <!-- Simulator Main Grid -->
  <g transform="translate(240, 80)">
    <!-- Controls (Left) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="420" height="580" rx="8" fill="url(#sim-card-grad)" stroke="#334155" />
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 412 0 C 416.42 0 420 3.58 420 8 L 420 40 L 0 40 Z" fill="#1e293b" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">⚙️ Failure Injection Controls</text>

      <g transform="translate(20, 60)">
        <!-- Scenario Selector -->
        <text x="0" y="15" fill="#e2e8f0" font-size="12" font-weight="600">1. Select Failure Injection Mode:</text>
        <rect y="25" width="380" height="38" rx="6" fill="#0f172a" stroke="#3b82f6" />
        <text x="14" y="49" fill="#38bdf8" font-size="12" font-weight="600">🔴 Covariate Drift (Severe Mean/Sigma Shift)</text>

        <!-- Target Feature -->
        <text x="0" y="90" fill="#e2e8f0" font-size="12" font-weight="600">2. Target Feature:</text>
        <rect y="100" width="380" height="38" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="124" fill="#f8fafc" font-size="12">credit_score</text>

        <!-- Intensity Slider -->
        <text x="0" y="165" fill="#e2e8f0" font-size="12" font-weight="600">3. Injection Intensity / Magnitude (0.0 - 1.0):</text>
        <text x="340" y="165" fill="#f59e0b" font-size="12" font-weight="700">0.45</text>
        <rect y="180" width="380" height="8" rx="4" fill="#1e293b" />
        <rect y="180" width="170" height="8" rx="4" fill="#f59e0b" />
        <circle cx="170" cy="184" r="7" fill="#fbbf24" />

        <!-- Batch Size -->
        <text x="0" y="220" fill="#e2e8f0" font-size="12" font-weight="600">4. Batch Size:</text>
        <rect y="230" width="380" height="38" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="254" fill="#f8fafc" font-size="12">1,000 inference records</text>

        <!-- Presets -->
        <text x="0" y="295" fill="#94a3b8" font-size="11">QUICK FAILURE PRESETS:</text>
        <g transform="translate(0, 305)">
          <rect width="180" height="30" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="10" y="19" fill="#e2e8f0" font-size="11">💥 Pipeline Outage (Nulls)</text>
          
          <rect x="195" y="0" width="185" height="30" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="205" y="19" fill="#e2e8f0" font-size="11">🔀 Sensor Skew (Noise)</text>
        </g>
        <g transform="translate(0, 345)">
          <rect width="180" height="30" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="10" y="19" fill="#e2e8f0" font-size="11">🌪️ Concept Drift</text>
          
          <rect x="195" y="0" width="185" height="30" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="205" y="19" fill="#e2e8f0" font-size="11">🔗 Joint Interaction Drop</text>
        </g>

        <!-- Action Button -->
        <rect y="440" width="380" height="46" rx="6" fill="#f59e0b" />
        <text x="110" y="468" fill="#0f172a" font-size="14" font-weight="700">⚡ Inject &amp; Run Live RCA</text>
      </g>
    </g>

    <!-- Live RCA Result on Injected Data (Right) -->
    <g transform="translate(440, 0)" filter="url(#shadow)">
      <rect width="480" height="580" rx="8" fill="url(#sim-card-grad)" stroke="#334155" />
      <path d="M 0 8 C 0 3.58 3.58 0 8 0 L 472 0 C 476.42 0 480 3.58 480 8 L 480 40 L 0 40 Z" fill="#1e293b" />
      <text x="20" y="26" fill="#f8fafc" font-size="13" font-weight="700">🎯 Instant Diagnosis &amp; Fix Impact Simulation</text>

      <g transform="translate(20, 60)">
        <rect width="440" height="85" rx="6" fill="#1e293b" stroke="#ef4444" />
        <text x="16" y="24" fill="#fca5a5" font-size="12" font-weight="700">Root Cause Successfully Isolated in 340ms:</text>
        <text x="16" y="44" fill="#e2e8f0" font-size="11">Target `credit_score` mean corrupted from 680 → 442</text>
        <text x="16" y="64" fill="#34d399" font-size="11" font-weight="600">✓ Counterfactual Flip: 91.2%  |  Confidence: 95.8% (HIGH)</text>

        <!-- Fix Simulation Card -->
        <g transform="translate(0, 105)">
          <text x="0" y="15" fill="#38bdf8" font-size="12" font-weight="600">Simulated Fix &amp; Accuracy Recovery:</text>
          <rect y="25" width="440" height="130" rx="6" fill="#0f172a" stroke="#10b981" />
          
          <text x="16" y="52" fill="#94a3b8" font-size="11">Before Fix (Corrupted):</text>
          <rect x="150" y="42" width="160" height="12" rx="3" fill="#ef4444" />
          <text x="320" y="52" fill="#f87171" font-size="11" font-weight="700">62.8% Accuracy</text>

          <text x="16" y="82" fill="#94a3b8" font-size="11">After Hotfix Imputation:</text>
          <rect x="150" y="72" width="220" height="12" rx="3" fill="#10b981" />
          <text x="380" y="82" fill="#34d399" font-size="11" font-weight="700">84.2%</text>

          <text x="16" y="112" fill="#38bdf8" font-size="10">✓ Projected Accuracy Gain: +21.4% (Restores 97.2% of baseline)</text>
        </g>

        <!-- Benchmark Badge -->
        <g transform="translate(0, 280)">
          <rect width="440" height="60" rx="6" fill="#1e293b" stroke="#334155" />
          <text x="14" y="24" fill="#e2e8f0" font-size="11" font-weight="600">1-Click Benchmark Demo Mode Available:</text>
          <text x="14" y="44" fill="#94a3b8" font-size="10">Runs all 6 failure types sequentially and generates full comparative telemetry.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
