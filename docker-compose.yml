services:
  backend:
    build: .
    ports:
      - "8000:7860"
    environment:
      DATABASE_URL: sqlite:////home/appuser/app/backend/data/rca_local.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - rca_data:/home/appuser/app/backend/data
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rca_data:
